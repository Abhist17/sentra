name: Program tests

# The Anchor suite needs a local validator and the SBF toolchain, which are a
# heavier install than the rest of CI. It runs when the program or its tests
# change, and on demand.
on:
  push:
    branches: [main]
    paths:
      - "sentra/programs/**"
      - "sentra/tests/**"
      - "sentra/Anchor.toml"
      - "sentra/Cargo.toml"
      - "sentra/Cargo.lock"
      - ".github/workflows/program-tests.yml"
  workflow_dispatch:

jobs:
  anchor:
    name: anchor test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: sentra
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sentra

      - uses: metadaoproject/setup-anchor@v3
        with:
          anchor-version: "0.32.1"
          solana-cli-version: "3.0.15"
          node-version: "22"

      # `anchor test` signs with the CLI's default keypair, which a fresh
      # runner does not have.
      - run: solana-keygen new --no-bip39-passphrase --silent --force

      - run: yarn install --frozen-lockfile

      - run: anchor test
