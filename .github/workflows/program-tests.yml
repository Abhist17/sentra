name: Program tests

# The Anchor suite needs a local validator and the SBF toolchain, which are a
# heavier install than the rest of CI. It runs when the program or its tests
# change, and on demand.
on:
  push:
    branches: [main]
    paths:
      - "sentra/programs/**"
      - "sentra/tests/**"
      - "sentra/Anchor.toml"
      - "sentra/Cargo.toml"
      - "sentra/Cargo.lock"
      - ".github/workflows/program-tests.yml"
  workflow_dispatch:

env:
  SOLANA_VERSION: "3.0.14"
  ANCHOR_VERSION: "0.32.1"

jobs:
  anchor:
    name: anchor test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: sentra
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sentra

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Solana CLI brings the test validator; the SBF platform tools
      # that `anchor build` downloads land in ~/.cache/solana, so both are
      # cached together and a warm run skips ~600 MB of downloads.
      - name: Cache Solana toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}-${{ env.ANCHOR_VERSION }}

      - name: Install Solana CLI
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/solana" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # Anchor 0.32 is not published to npm; the release ships a prebuilt
      # Linux binary, which beats compiling the CLI on every run.
      - name: Install Anchor CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/coral-xyz/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: solana --version && anchor --version

      # `anchor test` signs with the CLI's default keypair, which a fresh
      # runner does not have.
      - run: solana-keygen new --no-bip39-passphrase --silent --force

      - run: yarn install --frozen-lockfile

      - run: anchor test
