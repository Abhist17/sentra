[package]
name = "sentra"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sentra"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
# anchor-lang 0.32.1 moved to the split solana-* crates and no longer depends
# on the monolithic `solana-program`, but its anchor-debug codegen still emits
# absolute `::solana_program::log::…` paths. Enabling the feature therefore
# failed with E0433 — including for any editor configured with
# `rust-analyzer.cargo.features: "all"`, which is what put red squiggles on
# every #[derive(Accounts)] in this file.
#
# Pulling the crate in only when the feature is on keeps `--all-features`
# compiling without adding a heavyweight dependency to normal builds.
anchor-debug = ["dep:solana-program"]
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "0.32.1"
# Only linked when `anchor-debug` is enabled — see the note in [features].
solana-program = { version = "2.3", optional = true }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
